[project]
name = "extension-desk"
version = "0.1.0"
description = "Agentic climate-smart advisory drafting for an agricultural extension office (MCP server + officer approval gate)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
agent = ["pydantic-ai-slim[openai,mcp]>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
